name: Includ.IA CI (Temporary)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Testa o Código Python e a Lógica
  test-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Instala dependências extras de teste que não estão no requirements.txt principal
        pip install pytest httpx
        
    - name: Run Tests (QA)
      # Isso garante que sua API está rodando e os testes básicos passam
      env:
        GEMINI_API_KEY: "dummy_key_for_test" # Chave falsa pois o teste usa Mock
      run: |
        pytest

  # Job 2: Testa se o Docker consegue ser criado (Simula o Deploy no Azure)
  test-docker-build:
    needs: test-python
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      # Tenta construir a imagem usando seu Dockerfile
      run: docker build . --file Dockerfile --tag includia-api:test
