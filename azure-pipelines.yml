trigger:
  - azure-pipelines # Sua branch

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1. Script de Debug para mostrar onde estão os arquivos
- script: |
    echo ">>> LISTANDO ARQUIVOS DO REPOSITÓRIO:"
    find . -maxdepth 4 -not -path '*/.*'
  displayName: '🔍 Debug: Achar Dockerfile'

# 2. Tenta fazer o Build (vai falhar se o caminho estiver errado, mas olhe o log acima)
- task: Docker@2
  displayName: 'Build & Push IoT'
  inputs:
    containerRegistry: 'acrConnection'
    repository: 'app-includia-iot-2771'
    command: 'buildAndPush'
    # TENTATIVA MAIS PROVÁVEL (Se estiver na raiz):
    Dockerfile: '**/Dockerfile' 
    tags: 'latest'